<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#181425" />
  <!-- Install as an app ("Add to Home Screen"): opens full screen, without browser bars. -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CAU Survivor" />
  <meta name="description" content="CAU: Semester Survivor — a free browser shooter for CAU students. Shoot living assignments with your laptop. Unofficial student game, not affiliated with Central Asian University." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@400;700&display=swap" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23181425'/%3E%3Crect x='6' y='3' width='4' height='4' fill='%232ce8f5'/%3E%3Crect x='6' y='9' width='4' height='4' fill='%232ce8f5'/%3E%3Crect x='6' y='13' width='2' height='2' fill='%232ce8f5'/%3E%3C/svg%3E" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="CAU: Semester Survivor" />
  <meta property="og:description" content="A free browser game for CAU students: shoot your assignments with a laptop on a map of the real campus. Unofficial student game." />
  <meta name="twitter:card" content="summary" />
  <title>CAU: Semester Survivor</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #181425; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    #game { position: fixed; top: env(safe-area-inset-top); right: env(safe-area-inset-right); bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); display: flex; align-items: center; justify-content: center; }
    #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #181425; color: #fff; font: 16px ui-monospace, Menlo, Consolas, monospace;
      flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; }
    #rotate .phone { width: 40px; height: 70px; border: 3px solid #feae34; border-radius: 6px; animation: turn 2s ease-in-out infinite; }
    @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate"><div class="phone"></div><div id="rotate-text">Rotate your phone</div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
